name: CI
on:
  push:
    branches: [main, "module/**"]
  pull_request:
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: petcare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: petcare_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U petcare -d petcare_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PetCare.slnx --configfile .nuget/NuGet.Config
      - run: dotnet build PetCare.slnx --no-restore
      - run: dotnet test PetCare.slnx --no-build
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=petcare_test;Username=petcare;Password=ci-only-password
