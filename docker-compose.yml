services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    volumes:
      - petcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=petcare;Username=petcare;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  petcare-db:
